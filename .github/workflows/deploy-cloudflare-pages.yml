name: Deploy (Hugging Face data + Cloudflare landing)

# Single workflow, two publish targets per push to main/stage (ADR-0005):
#   - Hugging Face dataset `oskrgab/petrodb` carries the parquet *bytes*
#     (`*.parquet` + `_files.json`) on a branch matching the GitHub ref. HF
#     `resolve` URLs honour HTTP Range unconditionally, so DuckDB `httpfs`
#     consumers get true row-group pushdown (Cloudflare Pages does not).
#   - Cloudflare Pages carries the Landing + schema docs ONLY — no parquet and
#     no `_files.json` (ADR-0005). The deploy tree is the prerendered SvelteKit
#     build in `site/build` (ADR-0010), which already carries each Dataset's
#     schema.md/json/sql + README.md at their existing paths. The Pages
#     project's own custom domain serves it at `https://petrodb.ocortez.com/`
#     directly — no router, no subpath (ADR-0007).
#
# Every other branch that changes `site/` gets a Landing-only Pages preview
# from `deploy-landing-preview.yml`, which never touches Hugging Face.
#
# Branch → environment mapping is shared by both targets:
#   - push to `main`   → HF `main` revision + wrangler --branch main   → production (https://petrodb.ocortez.com/)
#   - push to `stage`  → HF `stage` branch  + wrangler --branch stage  → preview deployment
#
# Trigger: any push to main/stage that touches deployable content — committed
# datasets under `parquet/`, the 3W and Volve log pipeline sources and the
# Volve Raw repo pin (their outputs are gitignored and rebuilt in CI), the
# site sources, the Glances command, this
# workflow file, or the Landing build action it shares with the preview
# workflow (`.github/actions/build-landing`). `workflow_dispatch`
# allows manual redeploys without an empty commit.
#
# 3W pipeline re-run is gated by a cache keyed on the 3W source hashes plus
# the resolved per-branch BASE_URL (so the prod/stage Instance catalogs, which
# bake BASE_URL into `source_url`, never share a cache entry): if neither has changed, the previously-generated 3W tree is
# restored and the deploy goes out without re-running the pipeline.
#
# The Volve log tables are built the same way (ADR-0011, issue #75), from the
# Raw repo `oskrgab/petrodb-raw-volve` at the commit in `data/raw/volve.pin`.
# Their cache is keyed on that pin and the pipeline sources; on a miss, CI
# downloads only the files the pipeline names (`--list-raw-files`) and runs
# it. The pipeline's pre-publish checks fail the job before anything is
# uploaded. Restored or built, the tables must be in the checkout before the
# HF upload, whose `--delete` would otherwise remove the published ones.

on:
  push:
    branches: [main, stage]
    paths:
      - 'parquet/**'
      - 'README.md'
      - 'hf/README.md'
      - 'scripts/transform/petrobras_3w/**'
      - 'scripts/export/petrobras_3w/**'
      - 'scripts/run_pipeline/petrobras_3w/**'
      - 'data/raw/volve.pin'
      - 'scripts/transform/volve_logs/**'
      - 'scripts/export/volve_logs/**'
      - 'scripts/export/volve_descriptions.py'
      - 'scripts/run_pipeline/volve_logs/**'
      - 'scripts/deploy/**'
      - 'scripts/site/**'
      - 'site/**'
      - '.github/workflows/deploy-cloudflare-pages.yml'
      - '.github/actions/build-landing/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-pages-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref_name == 'main' || github.ref_name == 'stage'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Baked into `instances.parquet#source_url` so consumers can round-trip
      # the catalog to Observations URLs. Per-branch because the two HF
      # revisions (`/resolve/main/` vs `/resolve/stage/`) are distinct URL
      # bases; the catalog must reference the host+revision where its own
      # bytes are reachable. Points at the HF resolve bases (ADR-0005).
      BASE_URL: ${{ github.ref_name == 'main' && vars.BASE_URL_MAIN || vars.BASE_URL_STAGE }}
      # The host the Landing is published at, checked by the verify step
      # against the `canonical` the built home page names (issue #47). A
      # committed literal, deliberately: it MUST equal the host written in the
      # site's page sources (`site/src/routes/+page.svelte`), and the guard
      # compares these two independently maintained copies. Derived from the
      # build output, or read by the site build (its PUBLIC_ prefix would let
      # SvelteKit inline it), it would agree with whatever the build says and
      # validate nothing.
      PUBLIC_LANDING_URL: https://petrodb.ocortez.com
      # Umami's website id, inlined into the Landing build; unset, no tracker
      # loads. The tracker counts the production hostnames only, so a `stage`
      # build carries it without reporting. Branch previews and deploy.sh
      # builds get no id at all.
      PUBLIC_UMAMI_WEBSITE_ID: ${{ vars.UMAMI_WEBSITE_ID }}
      # The gitignored tables the Volve log pipeline writes, one per line: the
      # paths its cache holds and the presence check requires before upload.
      # A test keeps this list equal to the log tables in .gitignore.
      VOLVE_LOG_TABLES: |
        parquet/volve/petrophysical_interpretation.parquet
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore Petrobras 3W generated tree (if sources unchanged)
        id: cache-3w
        uses: actions/cache@v4
        with:
          path: parquet/petrobras_3w
          key: >-
            petrobras-3w-${{ hashFiles(
              'scripts/transform/petrobras_3w/**',
              'scripts/export/petrobras_3w/**',
              'scripts/run_pipeline/petrobras_3w/**'
            ) }}-${{ env.BASE_URL }}

      # The key is the Raw repo pin, the pipeline's own sources, the committed
      # files its pre-publish checks read (`wells.parquet`, `schema.json`) and
      # uv.lock (the readers' versions shape the output): a hit skips the
      # checks, so anything they depend on must miss the cache when it
      # changes. No BASE_URL: the log tables carry no URL, so `main` and
      # `stage` share an entry. actions/cache saves only when the job
      # succeeds, so a build that failed its checks is never cached.
      - name: Restore the Volve log tables (if the pin and sources are unchanged)
        id: cache-volve-logs
        uses: actions/cache@v4
        with:
          path: ${{ env.VOLVE_LOG_TABLES }}
          key: >-
            volve-logs-${{ hashFiles(
              'data/raw/volve.pin',
              'scripts/transform/volve_logs/**',
              'scripts/export/volve_logs/**',
              'scripts/export/volve_descriptions.py',
              'scripts/run_pipeline/volve_logs/**',
              'parquet/volve/wells.parquet',
              'parquet/volve/schema.json',
              'uv.lock'
            ) }}

      - name: Install uv
        if: steps.cache-3w.outputs.cache-hit != 'true' || steps.cache-volve-logs.outputs.cache-hit != 'true'
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        if: steps.cache-3w.outputs.cache-hit != 'true' || steps.cache-volve-logs.outputs.cache-hit != 'true'
        run: uv python install 3.12

      - name: Install dependencies
        if: steps.cache-3w.outputs.cache-hit != 'true' || steps.cache-volve-logs.outputs.cache-hit != 'true'
        run: uv sync --frozen

      - name: Build Petrobras 3W parquet tree
        if: steps.cache-3w.outputs.cache-hit != 'true'
        run: uv run python -m scripts.run_pipeline.petrobras_3w

      # The huggingface_hub CLI (`hf`) downloads the Volve raw files below and
      # uploads the parquet bytes later; it installs independently of the uv
      # steps, which are gated on a cache miss. hf_xet enables the fast Xet
      # transfer backend HF uses for content-addressed storage.
      - name: Install Hugging Face CLI
        run: pipx install "huggingface_hub[cli,hf_xet]==2.4.0"

      # Only the files the pipeline names, at the pinned commit, into the
      # local raw directory the pipeline reads by default (data/raw/README.md):
      # a few dozen files, not the 16 GB Raw repo. The pipeline prints the
      # list, so a source added there is fetched with no change here. A token
      # is required, since anonymous downloads are rate-limited per IP
      # (ADR-0011); HF_RAW_READ_TOKEN is a read token, and the upload token
      # stands in while it is unset. The pin is read and checked by the
      # pipeline's own read_pin.
      - name: Download the raw files the Volve log pipeline reads
        if: steps.cache-volve-logs.outputs.cache-hit != 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_RAW_READ_TOKEN || secrets.HF_TOKEN }}
          RAW_REPO: oskrgab/petrodb-raw-volve
        run: |
          if [[ -z ${HF_TOKEN:-} ]]; then
            echo "::error::No Hugging Face token to read $RAW_REPO: set the HF_RAW_READ_TOKEN secret"
            exit 1
          fi
          pin=$(uv run python -c 'from scripts.raw_repo.volve.pin import read_pin; print(read_pin() or "")')
          if [[ -z $pin ]]; then
            echo "::error::data/raw/volve.pin is empty: there is no Raw repo commit to build from"
            exit 1
          fi
          list=$(uv run python -m scripts.run_pipeline.volve_logs --list-raw-files)
          mapfile -t files <<<"$list"
          if [[ -z ${files[0]:-} ]]; then
            echo "::error::The Volve log pipeline lists no raw files"
            exit 1
          fi
          echo "Downloading ${#files[@]} files from $RAW_REPO at $pin"
          hf download "$RAW_REPO" "${files[@]}" \
            --repo-type dataset \
            --revision "$pin" \
            --local-dir data/raw/volve

      # Reads data/raw/volve/ and writes the tables into parquet/volve/, beside
      # the committed wells.parquet its checks join against. A failed
      # pre-publish check exits non-zero and leaves no table, so the job stops
      # here, before anything is uploaded.
      - name: Build the Volve log tables
        if: steps.cache-volve-logs.outputs.cache-hit != 'true'
        run: uv run python -m scripts.run_pipeline.volve_logs

      # On both paths, restored or built, every log table must be in the
      # checkout now: the HF upload below deletes remote Parquet that is
      # absent here, so a missing table would unpublish it.
      - name: Check the Volve log tables are present
        run: |
          count=0
          missing=0
          while IFS= read -r table; do
            [[ -z $table ]] && continue
            count=$((count + 1))
            if [[ -s $table ]]; then
              echo "OK: $table ($(wc -c <"$table") bytes)"
            else
              echo "::error::Volve log table missing or empty before upload: $table"
              missing=1
            fi
          done <<<"${VOLVE_LOG_TABLES:-}"
          if [[ $count -eq 0 ]]; then
            echo "::error::VOLVE_LOG_TABLES lists no table"
            exit 1
          fi
          exit "$missing"

      # Retarget every published data URL — the per-dataset schema READMEs
      # (which the site build copies into the Landing), the root README
      # quick-start, and the HF dataset card — to this
      # deploy's per-branch BASE_URL, so a `stage` push ships `…/resolve/stage/…`
      # and a `main` push ships `…/resolve/main/…` (issue #42, ADR-0005). Runs on
      # both the cache-hit and cache-miss paths (the 3W tree is populated either
      # way) and covers the surfaces the 3W run-pipeline does not. Pure stdlib,
      # so it uses the runner's system Python and needs neither uv nor the
      # dataset sources. Committed tree stays canonical `main`; this rewrites
      # only the ephemeral CI checkout, never git.
      - name: Retarget published data URLs to the deploy branch
        run: python3 -m scripts.deploy.retarget_data_urls

      # --- Hugging Face: publish the parquet bytes (ADR-0005) -----------------
      # Runs regardless of the 3W and Volve log cache outcomes — on a cache hit
      # the generated tables are restored, so `parquet/` is fully populated
      # either way.
      - name: Authenticate Hugging Face CLI
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: hf auth login --token "$HF_TOKEN"

      # `main` exists by default; ensure the `stage` branch is present before
      # uploading to it. `--exist-ok` makes the step idempotent across reruns.
      - name: Ensure HF stage branch exists
        if: github.ref_name == 'stage'
        run: >-
          hf repos branch create oskrgab/petrodb stage
          --repo-type dataset
          --revision main
          --exist-ok

      # Single-commit upload of the parquet bytes only (`*.parquet` +
      # `_files.json`); the landing/docs/svg stay Cloudflare-only. `--delete`
      # prunes files no longer produced by the build so the HF branch stays in
      # sync with the tree. Single commit (not upload-large-folder) because only
      # `hf upload` supports the `--delete` sync semantics.
      - name: Upload parquet bytes to Hugging Face
        run: >-
          hf upload oskrgab/petrodb parquet .
          --repo-type dataset
          --revision ${{ github.ref_name }}
          --include '**/*.parquet'
          --include '**/_files.json'
          --delete '**/*.parquet'
          --delete '**/_files.json'
          --commit-message "CI deploy: parquet tree from ${{ github.sha }}"

      # HF requires a dataset card to host a dataset. The card is the committed
      # source of truth at hf/README.md (kept outside parquet/ so it stays out
      # of the Cloudflare `pages deploy parquet/` tree); upload it to the repo
      # root README.md.
      - name: Upload Hugging Face dataset card
        run: >-
          hf upload oskrgab/petrodb hf/README.md README.md
          --repo-type dataset
          --revision ${{ github.ref_name }}
          --commit-message "CI deploy: dataset card from ${{ github.sha }}"

      # --- Cloudflare Pages: publish the built Landing (ADR-0007, ADR-0010) --
      # Build after the retarget pass and the 3W pipeline: the build copies each
      # Dataset's schema documents from parquet/ into the site, and BASE_URL
      # sets the data base the pages name (DATA_BASE in the site's loader).
      - name: Build the Landing
        uses: ./.github/actions/build-landing

      - name: List the deploy tree
        working-directory: site
        run: |
          echo "Deploy tree:"
          find build -type f -not -path 'build/_app/*' | sort

      # Belt-and-suspenders acceptance guard (issues #42, #54): every data URL in
      # the about-to-ship tree must be this deploy's own branch, and the tree
      # must carry no parquet and no `_files.json` (ADR-0005). Fails if the built
      # Landing or the HF dataset card still names the dev Caddy host or the
      # *other* branch's resolve base.
      #
      # The same step is the Landing host guard (issue #47): the tree must have
      # `index.html` at its root, and every `canonical` and `og:url` in that
      # page must name PUBLIC_LANDING_URL's scheme and host. This
      # catches a tree staged one directory deep, or a page that claims a host
      # it is not published at. Every check reports before the step fails.
      # Branch previews (deploy-landing-preview.yml) do not run this part: they
      # are served from `<branch>.<project>.pages.dev` by design, so the tree
      # is not published at the host its pages name, and main/stage run the
      # guard before anything reaches the Landing host.
      - name: Verify no off-branch data host in the built output
        env:
          OTHER_BASE: ${{ github.ref_name == 'main' && vars.BASE_URL_STAGE || vars.BASE_URL_MAIN }}
        run: |
          status=0
          python3 -m scripts.deploy.check_deploy_tree site/build hf/README.md || status=1

          fail() { echo "::error::Landing host guard: $1"; status=1; }
          # scheme://host of a URL, lowercased; empty if it has no scheme.
          origin() {
            if [[ $1 =~ ^([A-Za-z][A-Za-z0-9+.-]*://[^/?#]+) ]]; then
              echo "${BASH_REMATCH[1],,}"
            fi
          }
          # Every tag in $page matching ERE $1, ignoring case, one per line;
          # the page's line breaks are folded first, so a tag may span lines.
          tags_of() {
            tr '\r\n\t' '   ' <"$page" | { grep -oiE "$1" || true; }
          }
          # The value of attribute $2 in tag $1, quoted or not; empty if none.
          value_of() (
            shopt -s nocasematch
            re="[[:space:]]$2[[:space:]]*=[[:space:]]*(\"[^\"]*\"|'[^']*'|[^\"'[:space:]>]+)"
            if [[ $1 =~ $re ]]; then
              value=${BASH_REMATCH[1]}
              value=${value#[\"\']}
              echo "${value%[\"\']}"
            fi
          )
          # Every tag matching ERE $2 must carry attribute $3 naming the
          # Landing host; one it cannot read fails too. $1 names the tag in
          # messages. Leaves the number of tags seen in $count.
          check_tags() {
            count=0
            while IFS= read -r tag; do
              count=$((count + 1))
              url=$(value_of "$tag" "$3")
              if [[ -z $url ]]; then
                fail "$1 tag has no readable $3: $tag"
              elif [[ -n $want && $(origin "$url") != "$want" ]]; then
                fail "$1 names $url, not PUBLIC_LANDING_URL $landing"
              fi
            done < <(tags_of "$2")
          }

          tree=site/build
          page=$tree/index.html
          landing=${PUBLIC_LANDING_URL:-}
          want=$(origin "$landing")
          if [[ -z $landing ]]; then
            fail "PUBLIC_LANDING_URL is empty or unset; set it in the deploy job env"
          elif [[ -z $want ]]; then
            fail "PUBLIC_LANDING_URL is not an absolute URL: '$landing'"
          fi
          if [[ ! -f $page ]]; then
            found=$({ find "$tree" -name index.html -printf '%P\n' 2>/dev/null || true; } \
              | sort | head -n 3 | paste -sd ' ' || true)
            fail "no index.html at the root of $tree (index.html found at: ${found:-nowhere})"
          else
            is="[[:space:]]*=[[:space:]]*[\"']?"
            ends="([\"'[:space:]/][^>]*)?>"
            check_tags canonical "<link[^>]*[[:space:]]rel${is}canonical${ends}" href
            if [[ $count -eq 0 ]]; then
              fail "no canonical link in $page"
            fi
            check_tags og:url "<meta[^>]*[[:space:]](property|name)${is}og:url${ends}" content
          fi
          if [[ $status -eq 0 ]]; then
            echo "OK: $page names the Landing host $want"
          fi
          exit "$status"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: >-
            pages deploy site/build/
            --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }}
            --branch=${{ github.ref_name }}

      # Public URL guard (issue #48): poll the public Landing URL until it
      # answers 200 with the home page, and fail the job if it never does.
      # The verify step above checks the tree; only this one can see a
      # detached Pages custom domain or a broken DNS record.
      #
      # Limits, recorded rather than solved:
      #   - `main` only. A `stage` push deploys to a branch preview URL, not
      #     the custom domain, so there is no custom domain to poll; its tree
      #     is covered by the verify step alone.
      #   - Soft 404s. The host answers unmatched paths with the home page and
      #     status 200, so a status code alone proves only that something
      #     answered. This step therefore also requires LANDING_MARKER in the
      #     body. Do not add a status-only check of a deeper path (a schema
      #     doc, say): it passes even when that file is missing.
      #
      # Last on purpose: it depends on infrastructure outside the repo and can
      # flake, and by now the HF upload and the Pages deploy have finished.
      - name: Verify the Landing serves at its public URL
        if: github.ref_name == 'main'
        env:
          # The home page's <title>, from site/src/routes/+page.svelte; a test
          # fails if the two drift apart.
          LANDING_MARKER: '<title>PetroDB: open petroleum datasets in Parquet</title>'
          POLL_ATTEMPTS: 6
          POLL_DELAY_SECONDS: 10
        run: |
          url=${PUBLIC_LANDING_URL:-}
          if [[ -z $url ]]; then
            echo "::error::Public URL guard: PUBLIC_LANDING_URL is empty or unset"
            exit 1
          fi
          body=$(mktemp)
          code=000
          matched=no
          for ((attempt = 1; attempt <= POLL_ATTEMPTS; attempt++)); do
            # No -L: the Landing serves its root directly (ADR-0007), so a
            # redirect there is a hosting change this guard should surface.
            # curl prints 000 when nothing answered (DNS, TLS, connection),
            # and then writes no body: empty it so the last one cannot match.
            : >"$body"
            code=$(curl -sS --max-time 15 -o "$body" -w '%{http_code}' "$url") || true
            matched=no
            if grep -qF -- "$LANDING_MARKER" "$body"; then matched=yes; fi
            if [[ $code == 200 && $matched == yes ]]; then
              echo "OK: $url serves the Landing (attempt $attempt of $POLL_ATTEMPTS)"
              exit 0
            fi
            echo "Attempt $attempt of $POLL_ATTEMPTS: status $code, home page marker found: $matched"
            if ((attempt < POLL_ATTEMPTS)); then sleep "$POLL_DELAY_SECONDS"; fi
          done
          echo "::error::Public URL guard: $url did not serve the Landing after $POLL_ATTEMPTS attempts (last status $code, home page marker found: $matched)"
          exit 1
